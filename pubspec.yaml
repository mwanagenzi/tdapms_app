name: tdapms_app
description: "TDAPS Tenant Portal — Flutter client for the Tenant Deposit & Property Management System."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # HTTP
  dio: ^5.7.0

  # Secure token storage
  flutter_secure_storage: ^9.2.4

  # Declarative routing
  go_router: ^14.8.1

  # UI
  flutter_spinkit: ^5.2.1
  cached_network_image: ^3.4.1

  # Utilities
  intl: ^0.19.0
  connectivity_plus: ^6.1.1
  file_picker: ^8.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
